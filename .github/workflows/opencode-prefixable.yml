name: Build OpenCode Prefixable UI

on:
  push:
    tags:
      - "*"
    paths:
      - "prokube/app-prefixable/**"
      - "prokube/docker/**"
      - ".github/workflows/opencode-prefixable.yml"
  pull_request:
    paths:
      - "prokube/app-prefixable/**"
      - "prokube/docker/**"
      - ".github/workflows/opencode-prefixable.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: pk-opencode-prefixable
  IMAGE_PUSH_PATH: "${{ secrets.GCP_ARTIFACT_REGISTRY_PATH }}"

jobs:
  build-prefixable-image:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[SKIP BUILD]')
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate dynamic version
        id: version
        run: |
          CURRENT_TAG=$(git tag --points-at HEAD | head -n 1)

          if [ -n "$CURRENT_TAG" ]; then
            VERSION="${CURRENT_TAG}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            SHORT_COMMIT=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG}-${SHORT_COMMIT}"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Determine Docker tag
        run: |
          if [ -n "${{ steps.version.outputs.VERSION }}" ]; then
            echo "DOCKER_TAG=${{ steps.version.outputs.VERSION }}" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (PR - no push)
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} \
            -f prokube/docker/Dockerfile \
            --platform linux/amd64 \
            --build-arg S6_OVERLAY_VERSION=3.1.6.2 \
            --label "org.opencontainers.image.title=OpenCode Prefixable UI" \
            --label "org.opencontainers.image.description=Prefix-aware OpenCode Web UI for Kubeflow" \
            --label "org.opencontainers.image.source=${{ github.event.repository.html_url }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .

      - name: Build and push image
        if: github.event_name != 'pull_request'
        run: |
          # GCP Artifact Registry tags
          LATEST_TAG="${{ env.IMAGE_PUSH_PATH }}/${{ env.IMAGE_NAME }}:latest"
          VERSION_TAG="${{ env.IMAGE_PUSH_PATH }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}"
          COMMIT_TAG="${{ env.IMAGE_PUSH_PATH }}/${{ env.IMAGE_NAME }}:commit-${{ github.sha }}"

          # GitHub Container Registry tags
          GHCR_LATEST_TAG="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
          GHCR_VERSION_TAG="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}"
          GHCR_COMMIT_TAG="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:commit-${{ github.sha }}"

          # Build the image
          docker build \
            -t $LATEST_TAG \
            -f prokube/docker/Dockerfile \
            --platform linux/amd64 \
            --build-arg S6_OVERLAY_VERSION=3.1.6.2 \
            --label "org.opencontainers.image.title=OpenCode Prefixable UI" \
            --label "org.opencontainers.image.description=Prefix-aware OpenCode Web UI for Kubeflow" \
            --label "org.opencontainers.image.source=${{ github.event.repository.html_url }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .

          # Tag for different versions
          docker tag $LATEST_TAG $VERSION_TAG
          docker tag $LATEST_TAG $COMMIT_TAG
          docker tag $LATEST_TAG $GHCR_LATEST_TAG
          docker tag $LATEST_TAG $GHCR_VERSION_TAG
          docker tag $LATEST_TAG $GHCR_COMMIT_TAG

          # Push to GCP Artifact Registry
          docker push $LATEST_TAG
          docker push $VERSION_TAG
          docker push $COMMIT_TAG

          # Push to GitHub Container Registry
          docker push $GHCR_LATEST_TAG
          docker push $GHCR_VERSION_TAG
          docker push $GHCR_COMMIT_TAG

          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "- \`$LATEST_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$VERSION_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$COMMIT_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$GHCR_LATEST_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$GHCR_VERSION_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$GHCR_COMMIT_TAG\`" >> $GITHUB_STEP_SUMMARY
